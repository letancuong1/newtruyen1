<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <title>Đăng Ký - AloTruyen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="theme.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brandCyan: '#00d2ff',
                        brandPurple: '#8a2be2',
                        brandPink: '#ff3366',
                        brandOrange: '#ff7e5f'
                    },
                    boxShadow: {
                        glass: '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        glassHover: '0 12px 40px 0 rgba(31, 38, 135, 0.12)',
                        neonCyan: '0 0 15px rgba(0, 210, 255, 0.4)',
                        neonPurple: '0 0 15px rgba(138, 43, 226, 0.4)'
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-glass: rgba(255,255,255,0.65);
            --border-glass: rgba(255,255,255,0.8);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --card-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --bg-gradient-1: radial-gradient(at 0% 0%, rgba(0,210,255,0.12) 0px, transparent 50%);
            --bg-gradient-2: radial-gradient(at 100% 0%, rgba(138,43,226,0.12) 0px, transparent 50%);
            --bg-gradient-3: radial-gradient(at 100% 100%, rgba(255,126,95,0.12) 0px, transparent 50%);
            --bg-gradient-4: radial-gradient(at 0% 100%, rgba(0,210,255,0.12) 0px, transparent 50%);
            --accent-cyan: #00d2ff;
            --accent-purple: #8a2be2;
            --accent-orange: #ff7e5f;
            --accent-pink: #ff3366;
        }
        body {
            background-color: var(--bg-primary);
            background-image: var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3), var(--bg-gradient-4);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .glass-card {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            box-shadow: var(--card-shadow);
            transition: background 0.5s, border-color 0.5s, box-shadow 0.5s;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 210, 255, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(138, 43, 226, 0.6); }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 10s linear infinite; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-purple-500/30 selection:text-purple-200">

    <!-- Notification Box -->
    <div id="notification-box" class="fixed top-6 right-6 z-50 transform translate-x-80 opacity-0 transition-all duration-500 ease-out pointer-events-none">
        <div class="bg-white/90 backdrop-blur-md border border-brandCyan/40 px-6 py-3.5 rounded-xl shadow-2xl flex items-center gap-3">
            <span id="notif-icon" class="text-brandCyan text-base"><i class="fa-solid fa-circle-nodes animate-pulse"></i></span>
            <p id="notif-text" class="text-xs font-medium text-slate-700 tracking-wide font-sans"></p>
        </div>
    </div>

    <!-- Card chính -->
    <div class="w-full max-w-md bg-white rounded-3xl p-8 shadow-[0_10px_30px_rgba(0,0,0,0.06)] transition-all duration-500 relative overflow-hidden border border-gray-100">
        <div class="absolute -top-10 -left-10 w-40 h-40 bg-brandCyan/5 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-brandPurple/5 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Logo & Tiêu đề -->
        <div class="text-center mb-6">
            <a href="index.html" class="inline-block mb-3">
                <div class="flex items-center justify-center gap-3">
                    <div class="overflow-hidden rounded-xl shadow-md border border-white/80 bg-white">
                        <img src="logo.svg" alt="AloTruyen Logo" class="h-10 w-auto object-cover" onerror="this.src='https://placehold.co/100x100/00d2ff/ffffff?text=Alo';">
                    </div>
                    <div class="text-left">
                        <span class="text-2xl font-black bg-gradient-to-r from-brandCyan via-blue-500 to-brandPurple bg-clip-text text-transparent">AloTruyen</span>
                        <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Đọc Truyện Mọi Lúc, Mọi Nơi</p>
                    </div>
                </div>
            </a>
            <p class="text-xs text-slate-400 uppercase tracking-widest font-medium">Tạo tài khoản mới</p>
        </div>

        <!-- Form Đăng ký -->
        <form id="signup-form" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-widest text-slate-500 mb-1.5 font-sans">Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 text-xs"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" id="signup-email" required placeholder="Nhập email của bạn..." 
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2.5 pl-11 pr-4 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brandCyan focus:ring-2 focus:ring-brandCyan/20 focus:bg-white transition-all font-sans">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-bold uppercase tracking-widest text-slate-500 mb-1.5 font-sans">Tên Hiển Thị</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 text-xs"><i class="fa-solid fa-user-shield"></i></span>
                    <input type="text" id="signup-name" required placeholder="Nhập tên hiển thị..." 
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2.5 pl-11 pr-4 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brandPurple focus:ring-2 focus:ring-brandPurple/20 focus:bg-white transition-all font-sans">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-bold uppercase tracking-widest text-slate-500 mb-1.5 font-sans">Mật khẩu</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 text-xs"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="signup-password" required placeholder="Tối thiểu 6 ký tự" 
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2.5 pl-11 pr-4 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brandCyan focus:ring-2 focus:ring-brandCyan/20 focus:bg-white transition-all font-sans">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-bold uppercase tracking-widest text-slate-500 mb-1.5 font-sans">Xác Nhận Mật Khẩu</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 text-xs"><i class="fa-solid fa-shield-halved"></i></span>
                    <input type="password" id="signup-repassword" required placeholder="Nhập lại mật khẩu" 
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2.5 pl-11 pr-4 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brandCyan focus:ring-2 focus:ring-brandCyan/20 focus:bg-white transition-all font-sans">
                </div>
            </div>

            <div class="pt-3">
                <button type="submit" id="btn-register-submit"
                    class="w-full bg-gradient-to-r from-brandCyan to-brandPurple hover:from-cyan-400 hover:to-purple-500 text-white font-bold text-xs uppercase tracking-widest py-3.5 px-4 rounded-xl shadow-lg hover:shadow-lg hover:scale-[1.02] transition-all duration-300 flex items-center justify-center gap-2 font-sans">
                    <i class="fa-solid fa-user-plus"></i> Đăng Ký
                </button>
            </div>
        </form>

        <!-- Link Đăng nhập -->
        <div class="mt-6 pt-5 border-t border-gray-100 text-center">
            <p class="text-xs text-slate-500 font-sans">Đã có tài khoản? 
                <a href="login.html" class="text-brandCyan font-bold hover:text-brandPurple hover:underline transition-colors ml-1">Đăng Nhập Ngay</a>
            </p>
        </div>
    </div>

    <script>
        function showNotif(text, color = "cyan") {
            const box = document.getElementById('notification-box');
            const txt = document.getElementById('notif-text');
            const icon = document.getElementById('notif-icon');

            txt.innerText = text;
            if (color === "red") {
                box.firstElementChild.className = "bg-white/90 backdrop-blur-md border border-red-400/40 px-6 py-3.5 rounded-xl shadow-2xl flex items-center gap-3";
                icon.className = "text-red-400 text-base";
                icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else if (color === "cyan") {
                box.firstElementChild.className = "bg-white/90 backdrop-blur-md border border-brandCyan/40 px-6 py-3.5 rounded-xl shadow-2xl flex items-center gap-3";
                icon.className = "text-brandCyan text-base";
                icon.innerHTML = '<i class="fa-solid fa-circle-check animate-bounce"></i>';
            } else {
                box.firstElementChild.className = "bg-white/90 backdrop-blur-md border border-brandPurple/40 px-6 py-3.5 rounded-xl shadow-2xl flex items-center gap-3";
                icon.className = "text-brandPurple text-base";
                icon.innerHTML = '<i class="fa-solid fa-circle-nodes animate-pulse"></i>';
            }

            box.classList.remove('translate-x-80', 'opacity-0');
            box.classList.add('translate-x-0', 'opacity-100');

            setTimeout(() => {
                box.classList.remove('translate-x-0', 'opacity-100');
                box.classList.add('translate-x-80', 'opacity-0');
            }, 3000);
        }

        // KÍCH HOẠT KẾT NỐI API NODE.JS ĐĂNG KÝ
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const name = document.getElementById('signup-name').value;
            const password = document.getElementById('signup-password').value;
            const repassword = document.getElementById('signup-repassword').value;
            const btn = document.getElementById('btn-register-submit');

            if (password !== repassword) {
                showNotif("Mật khẩu xác nhận không khớp!", "red");
                return;
            }

            if (password.length < 6) {
                showNotif("Mật khẩu phải có ít nhất 6 ký tự!", "red");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Đang xử lý...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, name, password })
                });
                
                const data = await response.json();

                if (data.error) {
                    showNotif(data.error, "red");
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Đăng Ký';
                } else {
                    showNotif("Đăng ký thành công! Chuyển đến đăng nhập...", "cyan");
                    setTimeout(() => window.location.href = "login.html", 1500);
                }
            } catch (err) {
                showNotif("Lỗi kết nối đến máy chủ!", "red");
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Đăng Ký';
            }
        });
    </script>
    <script src="/js/rpg-system.js"></script>
</body>
</html>
