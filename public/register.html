<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <title>Đăng Ký - Thiên Đạo Truyện </title>
    <script src="//cdn.tailwindcss.com"></script>
    <link href="//fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Patrick+Hand&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { darkBg: 'var(--bg-color)', cardBg: 'var(--card-bg)', neonPurple: 'var(--primary-glow)', neonCyan: 'var(--secondary-glow)', neonGold: 'var(--accent-glow)' }, fontFamily: { sans: ['Inter', 'sans-serif'], cultivation: ['Cinzel', 'serif'] } } } }
    </script>
    <style>
        :root {
            --bg-color: #09051b;
            --card-bg: rgba(20, 13, 46, 0.45);
            --primary-glow: #bd00ff;
            --secondary-glow: #00f0ff;
            --accent-glow: #ffb800;
        }
        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 20%, rgba(189, 0, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(0, 240, 255, 0.06) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .text-glow-purple { text-shadow: 0 0 10px rgba(189, 0, 255, 0.6), 0 0 20px rgba(189, 0, 255, 0.3); }
        .text-glow-cyan { text-shadow: 0 0 10px rgba(0, 240, 255, 0.6), 0 0 20px rgba(0, 240, 255, 0.3); }
        .border-glow { box-shadow: 0 0 15px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(189, 0, 255, 0.05); }
        .border-glow:hover { box-shadow: 0 0 25px rgba(189, 0, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.1); border-color: rgba(189, 0, 255, 0.4); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-purple-500/30 selection:text-purple-200">

    <div id="notification-box" class="fixed top-6 right-6 z-50 transform translate-x-80 opacity-0 transition-all duration-500 ease-out pointer-events-none">
        <div class="bg-black/80 backdrop-blur-md border border-cyan-500/40 px-6 py-3.5 rounded-xl shadow-2xl flex items-center gap-3">
            <span id="notif-icon" class="text-cyan-400 text-base"><i class="fa-solid fa-circle-nodes animate-pulse"></i></span>
            <p id="notif-text" class="text-xs font-medium text-gray-200 tracking-wide font-sans"></p>
        </div>
    </div>

    <div class="w-full max-w-md bg-cardBg backdrop-blur-xl border border-white/5 rounded-3xl p-8 border-glow transition-all duration-500 relative overflow-hidden">
        <div class="absolute -top-10 -left-10 w-40 h-40 bg-cyan-600/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="text-center mb-6">
            <a href="index.html" class="inline-block mb-3 text-2xl font-black tracking-widest font-cultivation text-white group">
                THIÊN ĐẠO <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400 group-hover:text-glow-purple transition-all duration-300">TRUYỆN</span>
            </a>
            <p class="text-xs text-gray-400/80 uppercase tracking-widest font-medium">Lập Thệ Huyết Khế - Khai Mở Thần Biển</p>
        </div>

        <form id="signup-form" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5 font-sans">Linh Phù (Email)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500 text-xs"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" id="signup-email" required placeholder="dao_huu@tien_gioi.com" 
                        class="w-full bg-black/40 border border-white/5 rounded-xl py-2.5 pl-11 pr-4 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-purple-500/50 focus:bg-black/60 focus:ring-1 focus:ring-purple-500/20 transition-all font-sans">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5 font-sans">Tên Hiển Thị / Bản Mệnh</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500 text-xs"><i class="fa-solid fa-user-shield"></i></span>
                    <input type="text" id="signup-name" required placeholder="Hàn Lập, Tiêu Viêm..." 
                        class="w-full bg-black/40 border border-white/5 rounded-xl py-2.5 pl-11 pr-4 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-purple-500/50 focus:bg-black/60 focus:ring-1 focus:ring-purple-500/20 transition-all font-sans">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5 font-sans">Khẩu Quyết (Mật khẩu)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500 text-xs"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="signup-password" required placeholder="Tối thiểu 6 ký tự" 
                        class="w-full bg-black/40 border border-white/5 rounded-xl py-2.5 pl-11 pr-4 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-cyan-500/50 focus:bg-black/60 focus:ring-1 focus:ring-cyan-500/20 transition-all font-sans">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-1.5 font-sans">Xác Nhận Khẩu Quyết</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500 text-xs"><i class="fa-solid fa-shield-halved"></i></span>
                    <input type="password" id="signup-repassword" required placeholder="Nhập lại khẩu quyết" 
                        class="w-full bg-black/40 border border-white/5 rounded-xl py-2.5 pl-11 pr-4 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-cyan-500/50 focus:bg-black/60 focus:ring-1 focus:ring-cyan-500/20 transition-all font-sans">
                </div>
            </div>

            <div class="pt-3">
                <button type="submit" id="btn-register-submit"
                    class="w-full bg-gradient-to-r from-cyan-600 to-teal-600 hover:from-cyan-500 hover:to-teal-500 text-white font-bold text-xs uppercase tracking-widest py-3.5 px-4 rounded-xl shadow-lg hover:shadow-cyan-500/20 transition-all duration-300 flex items-center justify-center gap-2 border border-cyan-400/20 font-sans">
                    <i class="fa-solid fa-user-plus"></i> Lập Thệ Huyết Khế (Đăng Ký)
                </button>
            </div>
        </form>

        <div class="mt-6 pt-5 border-t border-white/5 text-center">
            <p class="text-xs text-gray-500 font-sans">Đã từng đăng ký danh tịch? 
                <a href="login.html" class="text-purple-400 hover:text-purple-300 font-bold transition-colors ml-1">Đăng Nhập Ngay</a>
            </p>
        </div>
    </div>

    <script>
        function showNotif(text, color = "cyan") {
            const box = document.getElementById('notification-box');
            const txt = document.getElementById('notif-text');
            const icon = document.getElementById('notif-icon');

            txt.innerText = text;
            if (color === "red") {
                box.firstElementChild.className = "bg-black/80 backdrop-blur-md border border-red-500/40 px-6 py-3.5 rounded-xl shadow-2xl flex items-center gap-3";
                icon.className = "text-red-400 text-base";
                icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else if (color === "cyan") {
                box.firstElementChild.className = "bg-black/80 backdrop-blur-md border border-cyan-500/40 px-6 py-3.5 rounded-xl shadow-2xl flex items-center gap-3";
                icon.className = "text-cyan-400 text-base";
                icon.innerHTML = '<i class="fa-solid fa-circle-check animate-bounce"></i>';
            } else {
                box.firstElementChild.className = "bg-black/80 backdrop-blur-md border border-purple-500/40 px-6 py-3.5 rounded-xl shadow-2xl flex items-center gap-3";
                icon.className = "text-purple-400 text-base";
                icon.innerHTML = '<i class="fa-solid fa-circle-nodes animate-pulse"></i>';
            }

            box.classList.remove('translate-x-80', 'opacity-0');
            box.classList.add('translate-x-0', 'opacity-100');

            setTimeout(() => {
                box.classList.remove('translate-x-0', 'opacity-100');
                box.classList.add('translate-x-80', 'opacity-0');
            }, 3000);
        }

        // KÍCH HOẠT KẾT NỐI API NODE.JS ĐĂNG KÝ
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const name = document.getElementById('signup-name').value;
            const password = document.getElementById('signup-password').value;
            const repassword = document.getElementById('signup-repassword').value;
            const btn = document.getElementById('btn-register-submit');

            if (password !== repassword) {
                showNotif("Khẩu quyết xác nhận không khớp!", "red");
                return;
            }

            if (password.length < 6) {
                showNotif("Khẩu quyết quá ngắn, dễ bị thiên ma dòm ngó (Tối thiểu 6 ký tự)!", "red");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Đang luyện hóa bản mệnh...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, name, password })
                });
                
                const data = await response.json();

                if (data.error) {
                    showNotif(data.error, "red");
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Lập Thệ Huyết Khế (Đăng Ký)';
                } else {
                    showNotif("Luyện hóa danh tịch thành công! Đang dẫn đạo sang Đăng nhập...", "cyan");
                    setTimeout(() => window.location.href = "login.html", 1500);
                }
            } catch (err) {
                showNotif("Thiên địa bất ổn, lỗi kết nối đến tàng kinh các!", "red");
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Lập Thệ Huyết Khế (Đăng Ký)';
            }
        });
    </script>
    <script src="/js/rpg-system.js"></script>\n</body>
</html>
