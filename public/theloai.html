    <script>
        // ===== MOBILE MENU FUNCTIONS (global, defined before header loads) =====
        window.toggleMobileMenu = function() {
            var overlay = document.getElementById('mobile-menu-overlay');
            var panel = document.getElementById('mobile-menu-panel');
            var bg = document.getElementById('mobile-menu-bg');
            var btn = document.getElementById('mobile-menu-btn');
            if (!overlay || !panel || !bg) return;
            var isOpen = !overlay.classList.contains('hidden');
            if (isOpen) {
                panel.style.transform = 'translateX(100%)';
                bg.style.opacity = '0';
                if (btn) btn.style.pointerEvents = 'none';
                setTimeout(function() { overlay.classList.add('hidden'); if (btn) { btn.style.pointerEvents = ''; btn.style.opacity = ''; } }, 400);
            } else {
                overlay.classList.remove('hidden');
                void panel.offsetWidth;
                panel.style.transform = 'translateX(0)';
                bg.style.opacity = '1';
                if (btn) btn.style.opacity = '0.6';
            }
        };
        window.closeMobileMenu = function() {
            var overlay = document.getElementById('mobile-menu-overlay');
            var panel = document.getElementById('mobile-menu-panel');
            var bg = document.getElementById('mobile-menu-bg');
            var btn = document.getElementById('mobile-menu-btn');
            if (!overlay || !panel || !bg) return;
            panel.style.transform = 'translateX(100%)';
            bg.style.opacity = '0';
            if (btn) { btn.style.pointerEvents = 'none'; btn.style.opacity = ''; }
            setTimeout(function() { overlay.classList.add('hidden'); if (btn) btn.style.pointerEvents = ''; }, 400);
        };

        // ===== TỰ ĐỘNG NẠP HEADER DÙNG CHUNG =====
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/header.html')
                .then(function(res) { if (!res.ok) throw new Error('Lỗi tải header'); return res.text(); })
                .then(function(html) { 
                    document.getElementById('app-header').innerHTML = html; 
                    var script = document.createElement('script');
                    script.src = '/js/header-init.js';
                    document.body.appendChild(script);
                })
                .catch(function(err) { console.error("Header error:", err); });
        });

        // Apply saved theme on load
        (function(){try{var t=localStorage.getItem('tdt_theme');if(t&&t!=='default')document.body.classList.add('theme-'+t);}catch(e){}})();

        // ===== DÙNG API_BASE TƯƠNG ĐỐI (giống doc-truyen.html) =====
        const API_BASE = '/api';
        const CATEGORIES_CACHE_KEY = 'tdt_categories_cache';
        const CATEGORIES_CACHE_TTL = 5 * 60 * 1000; // 5 phút

        const levelThresholds = [0,100,300,600,1000,1500,2100,2800,3600,4500,5500];
        const levelNames = ["Phàm Nhân","Luyện Khí","Trúc Cơ","Kết Đan","Nguyên Anh","Hóa Thần","Luyện Hư","Hợp Thể","Đại Thừa","Độ Kiếp","Chân Tiên"];

        // Cache categories
        function getCachedCategories() {
            try {
                const cached = localStorage.getItem(CATEGORIES_CACHE_KEY);
                if (!cached) return null;
                const parsed = JSON.parse(cached);
                if (Date.now() - parsed.timestamp > CATEGORIES_CACHE_TTL) {
                    localStorage.removeItem(CATEGORIES_CACHE_KEY);
                    return null;
                }
                return parsed.data;
            } catch(e) { return null; }
        }

        function setCachedCategories(data) {
            try {
                localStorage.setItem(CATEGORIES_CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data }));
            } catch(e) {}
        }

        function cleanTrashChars(str) { if (!str) return ""; return String(str).replace(/[\{\}\[\]"']/g,'').trim(); }

        function generateStarsHtml(avg, count) {
            const score=parseFloat(avg)||0;
            let h='<div class="flex items-center gap-0.5">';
            const active=Math.round(score);
            for(let i=1;i<=5;i++) h+=i<=active?'<i class="fa-solid fa-star text-amber-400 text-[10px] drop-shadow-[0_0_3px_#f59e0b]"></i>':'<i class="fa-solid fa-star text-gray-300 text-[10px]"></i>';
            return h+'</div>';
        }

        function isDeletedBook(book) {
            const s = (book.trang_thai || book.status || '').toLowerCase();
            return s.includes('đã xóa') || s.includes('đa xoa') || s === 'deleted';
        }

        function mapBook(book) {
            let cats = book.the_loai || ["Chưa rõ"];
            if (typeof cats === 'string' && cats.startsWith('[')) { try { cats = JSON.parse(cats); } catch(e){} }
            return {
                id:book.id,
                title:book.ten_truyen||book.title||"Vô Danh",
                cover:book.anh_bia||book.cover_url||"https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=250&auto=format&fit=crop",
                author:book.tac_gia||book.author||"Khuyết Danh",
                categories:Array.isArray(cats)?cats:[cats],
                viewsNum:parseInt(book.luot_xem||book.views)||0,
                status:book.trang_thai||book.status||"Đang tiến hành",
                isVip:book.is_vip===true||book.is_vip==='true',
                slug:book.slug||"",
                chaptersCount:parseInt(book.so_chuong||book.chapters_count)||0,
                ratingCount:parseInt(book.rating_count)||0,
                ratingAvg:parseFloat(book.rating_avg||book.rating)||0,
                intro:book.gioi_thieu||book.description||"Chưa có giới thiệu...",
                created_at:book.created_at,
                _deleted: isDeletedBook(book)
            };
        }

        function calculateLevelData(totalExp) { let lv=0; for(let i=0;i<levelThresholds.length;i++) if(totalExp>=levelThresholds[i]) lv=i; else break; const b=levelThresholds[lv]||0; const n=levelThresholds[lv+1]||(b+99999); const eIn=totalExp-b; const eTo=n-b; const pct=Math.min((eIn/eTo)*100,100); return {level:lv+1, name:levelNames[lv]||"Chân Tiên", expInLevel:eIn, expToNextLevel:eTo, progressPercent:pct}; }

        function getDbProfile() { try { const s=localStorage.getItem('user_data'); return s?JSON.parse(s):null; } catch(e){ return null; } }

        function showSystemNotif(msg) {
            const container = document.getElementById('system-notif-container');
            if (!container) return;
            const n = document.createElement('div');
            n.className = "bg-slate-950/95 text-white border border-neonCyan/40 p-3 rounded-xl shadow-lg text-xs font-mono backdrop-blur-sm pointer-events-auto transition-all duration-300 transform translate-y-2 opacity-0 min-w-[200px]";
            n.innerHTML = `<i class="fa-solid fa-bell text-neonCyan mr-2"></i> ${msg}`;
            container.appendChild(n);
            setTimeout(() => n.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => { n.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => n.remove(), 300); }, 3500);
        }

        let activeGenre = "all";
        let allBooks = [];
        let allCategories = [];
        let itemsToShow = 15;
        const INITIAL_ITEMS = 15;

        // ===== RENDER CATEGORIES TỪ CACHE TRƯỚC KHI FETCH =====
        function renderCategoriesFromCache() {
            const cached = getCachedCategories();
            if (cached && cached.length > 0) {
                allCategories = cached;
                renderGenreButtons();
            }
        }

        // ===== FETCH CATEGORIES VÀ CACHE =====
        async function fetchCategories() {
            try {
                const res = await fetch(`${API_BASE}/get_categories`);
                const d = await res.json();
                if (d.success && d.categories) {
                    allCategories = d.categories;
                    setCachedCategories(d.categories);
                    renderGenreButtons();
                }
            } catch(e) {
                console.error("Lỗi tải categories:", e);
            }
        }

        function setActiveGenre(genre) {
            // Highlight nút được click ngay lập tức
            document.querySelectorAll('.genre-btn').forEach(btn => {
                const isActive = btn.dataset.genre === genre;
                btn.className = `genre-btn px-5 py-2.5 rounded-xl font-bold text-xs transition-all ${
                    isActive 
                        ? 'bg-gradient-to-r from-brandCyan to-brandPurple text-white shadow-md' 
                        : 'bg-white/50 text-slate-500 hover:text-brandCyan border border-gray-200'
                }`;
            });
        }

        function renderGenreButtons() {
            const c = document.getElementById("genre-selector-container");
            if (!c) return;
            c.innerHTML = "";
            
            // Nút TẤT CẢ
            let allBtn = document.createElement("button");
            allBtn.className = `genre-btn px-5 py-2.5 rounded-xl font-bold text-xs transition-all ${activeGenre === 'all' ? 'bg-gradient-to-r from-brandCyan to-brandPurple text-white shadow-md' : 'bg-white/50 text-slate-500 hover:text-brandCyan border border-gray-200'}`;
            allBtn.dataset.genre = "all";
            allBtn.innerText = "TẤT CẢ";
            allBtn.onclick = () => { 
                activeGenre = "all"; 
                itemsToShow = INITIAL_ITEMS; 
                setActiveGenre("all");
                renderGenresPage(); 
            };
            c.appendChild(allBtn);

            allCategories.forEach(g => {
                const isA = g.name === activeGenre;
                const btn = document.createElement("button");
                btn.className = `genre-btn px-5 py-2.5 rounded-xl font-bold text-xs transition-all ${isA ? 'bg-gradient-to-r from-brandCyan to-brandPurple text-white shadow-md' : 'bg-white/50 text-slate-500 hover:text-brandCyan border border-gray-200'}`;
                btn.dataset.genre = g.name;
                btn.innerText = g.name.toUpperCase();
                btn.onclick = () => { 
                    activeGenre = g.name; 
                    itemsToShow = INITIAL_ITEMS; 
                    setActiveGenre(g.name);
                    renderGenresPage(); 
                };
                c.appendChild(btn);
            });
        }

        // ===== LOAD DATA CHÍNH - KHÔNG DÙNG AWAIT ĐỂ UI KHÔNG BỊ BLOCK =====
        function loadData() {
            // Bước 1: Render categories từ cache ngay lập tức
            renderCategoriesFromCache();
            
            // Bước 2: Fetch categories từ server (sẽ cập nhật sau nếu cache hết hạn)
            fetchCategories();

            // Bước 3: Fetch 6 truyện đầu tiên - KHÔNG AWAIT, UI skeleton đã hiển thị sẵn
            fetch6Books();
        }

        function fetch6Books() {
            fetch(`${API_BASE}/get_books?type=newest&limit=6`)
                .then(r => r.json())
                .then(d => {
                    if (d.success || d.books) {
                        allBooks = (d.books || []).map(mapBook);
                        itemsToShow = 6;
                        renderGenresPage();

                        // Bước 4: Fetch thêm 15 truyện (background)
                        fetch15Books();
                    }
                })
                .catch(err => {
                    console.error("Lỗi tải 6 truyện:", err);
                    // Fallback: thử load toàn bộ
                    fetchAllBooks();
                });
        }

        function fetch15Books() {
            fetch(`${API_BASE}/get_books?type=newest&limit=15`)
                .then(r => r.json())
                .then(d => {
                    if (d.success || d.books) {
                        allBooks = (d.books || []).map(mapBook);
                        itemsToShow = 15;
                        renderGenresPage();
                    }
                    // Bước 5: Fetch toàn bộ (background)
                    fetchAllBooks();
                })
                .catch(err => {
                    console.error("Lỗi tải 15 truyện:", err);
                    fetchAllBooks();
                });
        }

        function fetchAllBooks() {
            fetch(`${API_BASE}/get_books_by_category?category=all`)
                .then(rAll => rAll.json())
                .then(dAll => {
                    if (dAll.success || dAll.books) {
                        allBooks = (dAll.books || []).map(mapBook);
                        renderGenresPage();
                    }
                })
                .catch(err => console.error("Lỗi tải toàn bộ truyện:", err));
        }

        function renderGenresPage() {
            const bC = document.getElementById("genre-books-list");
            if (!bC) return;

            // Lọc bỏ truyện đã xóa
            let filtered = allBooks.filter(b => !b._deleted);
            if (activeGenre !== "all") {
                filtered = filtered.filter(b => b.categories.some(cat => cleanTrashChars(cat) === activeGenre));
            }

            if (itemsToShow > filtered.length) itemsToShow = filtered.length;
            const pageItems = filtered.slice(0, itemsToShow);

            // Nếu chưa có dữ liệu, giữ nguyên skeleton
            if (pageItems.length === 0) return;

            bC.innerHTML = "";

            const info = document.createElement("div");
            info.className = "col-span-full flex justify-between items-center text-xs text-gray-400 font-mono mb-2";
            info.innerHTML = `<span>Hiển thị 1-${itemsToShow} / ${filtered.length} linh thư</span>`;
            bC.appendChild(info);

            pageItems.forEach(b => {
                const vip = b.isVip ? '<span class="text-[9px] bg-red-100 text-red-500 border border-red-200 px-1.5 py-0.5 rounded font-bold">VIP</span>' : '';
                const cats = b.categories.slice(0,3).map(cat => `<span class="text-[9px] text-brandCyan border border-cyan-200 bg-cyan-50 px-1.5 py-0.5 rounded">${cleanTrashChars(cat)}</span>`).join('');
                
                bC.innerHTML += `<div class="bg-white/70 backdrop-blur-sm border border-gray-200 hover:border-brandCyan p-4 rounded-2xl flex gap-4 transition-all hover:-translate-y-1 hover:shadow-glassHover group cursor-pointer animate-fade-in" onclick="openDetailPage('${b.id}')" style="animation:fadeIn 0.3s ease-out forwards">
                    <div class="w-24 h-36 rounded-xl overflow-hidden flex-shrink-0 shadow-md border border-white/80 bg-gray-100">
                        <img src="${b.cover}" class="w-full h-full object-cover" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=250&auto=format&fit=crop'">
                    </div>
                    <div class="flex flex-col justify-between flex-1 min-w-0">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <h4 class="font-bold text-slate-800 truncate flex-1 text-sm">${cleanTrashChars(b.title)}</h4>
                                ${vip}
                            </div>
                            <p class="text-xs text-slate-500 mb-1.5 truncate"><i class="fa-solid fa-pen-nib mr-1 text-[10px] text-brandCyan"></i> ${cleanTrashChars(b.author)}</p>
                            <div class="flex flex-wrap gap-1.5 mb-2">${cats}</div>
                            <p class="text-[11px] text-slate-600 line-clamp-2 italic bg-white/50 p-2 rounded-lg border border-gray-100 leading-relaxed">${cleanTrashChars(b.intro)}</p>
                        </div>
                        <div class="flex justify-between items-center text-[11px] border-t border-gray-100 pt-2 text-slate-500">
                            <span class="flex items-center gap-1 text-brandCyan font-semibold"><i class="fa-solid fa-scroll text-[10px]"></i> ${b.chaptersCount} Chương</span>
                            <span class="flex items-center gap-1"><i class="fa-solid fa-eye text-[10px]"></i> ${b.viewsNum.toLocaleString('vi-VN')}</span>
                            <div class="flex items-center gap-1">${generateStarsHtml(b.ratingAvg, b.ratingCount)}</div>
                        </div>
                    </div>
                </div>`;
            });

            if (itemsToShow < filtered.length) {
                const pag = document.createElement("div");
                pag.className = "col-span-full flex flex-col items-center gap-3 mt-6";
                let pagHtml = `<button onclick="loadMoreBooks()" id="load-more-btn" class="px-6 py-3 rounded-xl bg-gradient-to-r from-brandCyan to-brandPurple text-white text-xs font-bold hover:shadow-lg hover:scale-105 transition-all shadow-md">
                    <i class="fa-solid fa-angles-down mr-2"></i> Tải Thêm Truyện (${filtered.length - itemsToShow} quyển còn lại)
                </button>`;
                pag.innerHTML = pagHtml;
                bC.appendChild(pag);
            } else if (filtered.length > INITIAL_ITEMS) {
                const pag = document.createElement("div");
                pag.className = "col-span-full flex flex-col items-center gap-3 mt-6";
                pag.innerHTML = `<p class="text-xs text-gray-500 font-mono">Đã hiển thị tất cả ${filtered.length} linh thư</p>`;
                bC.appendChild(pag);
            }
        }

        function openDetailPage(bookId) {
            if (!bookId) return;
            // Tìm book trong danh sách đã load
            const book = allBooks.find(b => String(b.id) === String(bookId));
            var slug = bookId; // fallback to id
            if (book) {
                try {
                    slug = book.slug || bookId;
                    const compact = {
                        id: book.id,
                        ten_truyen: book.title,
                        anh_bia: book.cover,
                        tac_gia: book.author,
                        gioi_thieu: book.intro,
                        so_chuong: book.chaptersCount,
                        luot_xem: book.viewsNum,
                        rating_avg: book.ratingAvg,
                        rating_count: book.ratingCount,
                        the_loai: book.categories,
                        slug: slug
                    };
                    sessionStorage.setItem('preload_book', JSON.stringify(compact));
                } catch(e) { /* ignore */ }
            }
            window.location.href = `chi-tiet-truyen.html?slug=${encodeURIComponent(slug)}`;
        }

        function loadMoreBooks() {
            itemsToShow += INITIAL_ITEMS;
            renderGenresPage();
        }

        // ===== KHỞI TẠO =====
        document.addEventListener('DOMContentLoaded', () => {
            // Render categories từ cache ngay lập tức (nếu có)
            renderCategoriesFromCache();
            // Load data bất đồng bộ
            loadData();
        });

        // Fallback cho window.onload
        window.onload = () => {
            // Đã chạy trong DOMContentLoaded rồi, nhưng để an toàn
        };
    </script>
    <script src="/js/rpg-system.js"></script>\n</body>
</html>
